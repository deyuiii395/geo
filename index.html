<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高中数学：空间几何体交互教学</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MathJax for LaTeX Formulas -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: {
                fontCache: 'global'
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <!-- Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- TWEEN.js used for smooth animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 0; }
        
        /* Glassmorphism UI Panels */
        .glass-panel {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 4px; }

        .nav-btn {
            transition: all 0.2s;
            border-left: 4px solid transparent;
        }
        .nav-btn:hover { background: rgba(59, 130, 246, 0.1); border-left-color: #60a5fa; padding-left: 1.2rem; }
        .nav-btn.active { background: rgba(37, 99, 235, 0.2); border-left-color: #3b82f6; color: #fff; padding-left: 1.2rem; }

        .math-display {
            font-size: 1.25em; /* Larger math */
            margin: 12px 0;
            color: #93c5fd;
        }

        #loading-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #3b82f6;
            font-size: 1.5rem;
            z-index: 5;
            text-align: center;
        }

        /* Toggle Switch */
        .toggle-checkbox {
            height: 1.5rem;
            width: 3rem;
        }
        .toggle-checkbox:checked {
            right: 0;
            border-color: #3b82f6;
        }

        /* Mode Controls */
        .mode-btn {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px; /* Larger hit area */
            border-radius: 8px;
            font-size: 1rem; /* Larger text */
            cursor: pointer;
            transition: all 0.2s;
            color: #94a3b8;
        }
        .mode-btn.active {
            background: #2563eb;
            color: white;
            border-color: #3b82f6;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.5);
        }
        .mode-btn:hover:not(.active) {
            background: rgba(59, 130, 246, 0.2);
        }
    </style>
</head>
<body>

    <!-- Loading Indicator -->
    <div id="loading-overlay">
        正在加载 3D 引擎资源...<br>
        <span style="font-size: 1rem; color: #64748b;">如果长时间无法显示，请检查网络或代理设置</span>
    </div>

    <!-- 3D Canvas -->
    <div id="canvas-container"></div>

    <!-- Top Control Bar -->
    <div class="absolute top-6 left-80 z-20 flex gap-4" id="top-controls">
        <!-- Prism Type Controls -->
        <div id="prism-controls" class="glass-panel rounded-lg p-2 flex gap-3 hidden">
            <button class="mode-btn active" onclick="setPrismType('right')">直棱柱</button>
            <button class="mode-btn" onclick="setPrismType('regular')">正棱柱</button>
            <button class="mode-btn" onclick="setPrismType('oblique')">斜棱柱</button>
        </div>

        <!-- View Mode Controls -->
        <div id="view-controls" class="glass-panel rounded-lg p-2 flex gap-3">
            <button class="mode-btn active" id="btn-solid" onclick="toggleViewMode('solid')">立体模型</button>
            <button class="mode-btn" id="btn-net" onclick="toggleViewMode('net')">展开演示</button>
            <button class="mode-btn hidden" id="btn-gen" onclick="toggleViewMode('gen')">生成演示</button>
        </div>
    </div>

    <!-- Left Sidebar: Controls -->
    <div class="absolute top-0 left-0 h-full w-72 glass-panel flex flex-col z-10 shadow-xl" id="sidebar">
        <div class="p-6 border-b border-gray-700">
            <h1 class="text-2xl font-bold text-blue-400">空间几何体</h1>
            <p class="text-sm text-gray-400 mt-2">高三数学一轮复习 · 交互系统</p>
        </div>
        
        <div class="flex-1 overflow-y-auto py-4">
            <div class="px-6 text-sm font-bold text-gray-500 uppercase tracking-wider mb-3 mt-2">简单多面体</div>
            <button class="nav-btn active w-full text-left px-8 py-4 text-base" data-shape="prism" onclick="loadShape('prism')">棱柱 (Prism)</button>
            <button class="nav-btn w-full text-left px-8 py-4 text-base" data-shape="pyramid" onclick="loadShape('pyramid')">棱锥 (Pyramid)</button>
            <button class="nav-btn w-full text-left px-8 py-4 text-base" data-shape="frustum_poly" onclick="loadShape('frustum_poly')">棱台 (Frustum)</button>
            
            <div class="px-6 text-sm font-bold text-gray-500 uppercase tracking-wider mt-8 mb-3">旋转体</div>
            <button class="nav-btn w-full text-left px-8 py-4 text-base" data-shape="cylinder" onclick="loadShape('cylinder')">圆柱 (Cylinder)</button>
            <button class="nav-btn w-full text-left px-8 py-4 text-base" data-shape="cone" onclick="loadShape('cone')">圆锥 (Cone)</button>
            <button class="nav-btn w-full text-left px-8 py-4 text-base" data-shape="frustum_circ" onclick="loadShape('frustum_circ')">圆台 (Frustum)</button>
            <button class="nav-btn w-full text-left px-8 py-4 text-base" data-shape="sphere" onclick="loadShape('sphere')">球 (Sphere)</button>
        </div>

        <div class="p-6 border-t border-gray-700 bg-slate-900/50">
            <div class="flex items-center justify-between mb-4">
                <span class="text-base">自动旋转</span>
                <input type="checkbox" id="autoRotate" checked class="w-5 h-5 accent-blue-500 cursor-pointer" onchange="toggleAutoRotate(this.checked)">
            </div>
            <div class="flex items-center justify-between">
                <span class="text-base">透视模式</span>
                <input type="checkbox" id="wireframeToggle" class="w-5 h-5 accent-blue-500 cursor-pointer" onchange="toggleWireframe(this.checked)">
            </div>
            <div class="mt-4 text-sm text-gray-500 text-center">
                拖动旋转 · 滚轮缩放
            </div>
        </div>
    </div>

    <!-- Right Panel: Info & Formulas (REDUCED WIDTH) -->
    <div class="absolute top-6 right-6 w-[380px] glass-panel rounded-xl p-8 z-10 max-h-[90vh] overflow-y-auto shadow-2xl">
        <h2 id="shape-title" class="text-3xl font-bold text-white mb-3">正六棱柱</h2>
        <div class="w-20 h-1.5 bg-blue-500 mb-6 rounded-full"></div>
        
        <div id="shape-content" class="space-y-8">
            <!-- Content will be injected here via JS -->
        </div>
    </div>

    <script>
        // --- Geometry Data ---
        const geometryData = {
            prism: {
                title: "棱柱 (Prism)",
                definition: "有两个面互相平行，其余各面都是四边形，并且每相邻两个四边形的公共边都互相平行。",
                features: [
                    "<strong>直棱柱：</strong>侧棱垂直于底面的棱柱。底面可是任意多边形。",
                    "<strong>正棱柱：</strong>底面是正多边形的直棱柱。",
                    "<strong>斜棱柱：</strong>侧棱不垂直于底面的棱柱。",
                    "<strong>四棱柱：</strong>底面是四边形的棱柱（如长方体、立方体）。"
                ],
                formulas: {
                    area: "S_{表面} = S_{侧} + 2S_{底}",
                    volume: "V = S_{底}h",
                    lateral: "S_{直棱柱侧} = ch"
                },
                type: 'prism'
            },
            pyramid: {
                title: "棱锥 (Pyramid)",
                definition: "有一个面是多边形，其余各面都是有一个公共顶点的三角形。",
                features: [
                    "<strong>正棱锥：</strong>底面是正多边形，顶点在底面的射影是中心。",
                    "<strong>展开图：</strong>由一个底面多边形和多个侧面三角形组成，呈现星形或放射状。"
                ],
                formulas: {
                    area: "S_{表面} = S_{侧} + S_{底}",
                    volume: "V = \\frac{1}{3}S_{底}h",
                    lateral: "S_{正棱锥侧} = \\frac{1}{2}ch'"
                },
                type: 'pyramid'
            },
            frustum_poly: {
                title: "棱台 (Frustum of Prism)",
                definition: "用一个平行于棱锥底面的平面去截棱锥，底面和截面之间的部分。",
                features: [
                    "上、下底面互相平行且相似。",
                    "<strong>展开图：</strong>由大小两个底面多边形和多个侧面梯形组成。"
                ],
                formulas: {
                    volume: "V = \\frac{1}{3}(S_{上} + S_{下} + \\sqrt{S_{上}S_{下}})h",
                    note: "体积公式“万能公式”：$V=\\frac{h}{6}(S_{上}+4S_{中}+S_{下})$"
                },
                type: 'frustum_poly'
            },
            cylinder: {
                title: "圆柱 (Cylinder)",
                definition: "以矩形的一边所在直线为旋转轴，其余三边旋转形成的面所围成的旋转体。",
                features: [
                    "<strong>生成：</strong>矩形绕一边旋转一周。",
                    "<strong>展开图：</strong>侧面展开是一个矩形，长为底面周长 $2\\pi r$，宽为高 $h$。加上两个底面圆。",
                    "轴截面是矩形。"
                ],
                formulas: {
                    lateral: "S_{侧} = 2\\pi rh",
                    area: "S_{表} = 2\\pi r(r+h)",
                    volume: "V = \\pi r^2 h"
                },
                type: 'cylinder'
            },
            cone: {
                title: "圆锥 (Cone)",
                definition: "以直角三角形的一条直角边所在直线为旋转轴，其余两边旋转形成的面所围成的旋转体。",
                features: [
                    "<strong>生成：</strong>直角三角形绕一直角边旋转一周。",
                    "<strong>展开图：</strong>侧面展开是一个扇形，半径为母线 $l$，弧长为 $2\\pi r$。加上一个底面圆。",
                    "轴截面是等腰三角形。"
                ],
                formulas: {
                    lateral: "S_{侧} = \\pi rl",
                    area: "S_{表} = \\pi r(l+r)",
                    volume: "V = \\frac{1}{3}\\pi r^2 h"
                },
                type: 'cone'
            },
            frustum_circ: {
                title: "圆台 (Frustum of Cone)",
                definition: "用平行于圆锥底面的平面去截圆锥，底面和截面之间的部分。",
                features: [
                    "<strong>生成：</strong>直角梯形绕垂直于底的腰旋转一周。",
                    "<strong>展开图：</strong>侧面展开是一个扇环。加上大小两个底面圆。",
                    "轴截面是等腰梯形。"
                ],
                formulas: {
                    lateral: "S_{侧} = \\pi(r_1 + r_2)l",
                    volume: "V = \\frac{1}{3}\\pi(r_1^2 + r_2^2 + r_1r_2)h"
                },
                type: 'frustum_circ'
            },
            sphere: {
                title: "球 (Sphere)",
                definition: "以半圆的直径所在直线为旋转轴，半圆面旋转一周形成的几何体。",
                features: [
                    "<strong>生成：</strong>半圆绕直径旋转一周。",
                    "球是不可展曲面，无法在平面上完全无损展开（类似于剥橘子皮，总有撕裂或重叠）。",
                    "地图制作中的“投影”即是为了解决此问题。"
                ],
                formulas: {
                    area: "S = 4\\pi R^2",
                    volume: "V = \\frac{4}{3}\\pi R^3"
                },
                type: 'sphere'
            }
        };

        // --- Global State ---
        let scene, camera, renderer, controls;
        let currentShapeKey = 'prism';
        let currentPrismType = 'right'; 
        let currentViewMode = 'solid'; 
        
        let activeGroup = null; 
        let unfoldTweens = []; 

        let isWireframe = false;
        let isAutoRotate = true;

        // Generation Animation State
        let genProgress = 0; 
        let isGenAnimating = false;
        let genSpeed = 0.01;

        // Colors
        const COLOR_FACE = 0x3b82f6;
        const COLOR_FACE_INNER = 0x2563eb;
        const COLOR_EDGE = 0x93c5fd;
        const COLOR_GEN_PLANE = 0xfacc15; 
        const COLOR_AXIS = 0xffffff;

        // Camera presets
        const CAM_POS_ISO = new THREE.Vector3(6, 5, 6);
        const CAM_POS_FRONT = new THREE.Vector3(0, 2, 9); 
        const CAM_POS_NET_ROT = new THREE.Vector3(0, 25, 4); 
        const CAM_POS_NET_POLY = new THREE.Vector3(0, 20, 0);
        
        const LOOK_AT_CENTER = new THREE.Vector3(0, 1.5, 0);

        function init() {
            if (typeof THREE === 'undefined') {
                document.getElementById('loading-overlay').innerHTML = '<span style="color: #ef4444;">资源加载失败，请刷新或检查网络。</span>';
                return;
            }
            document.getElementById('loading-overlay').style.display = 'none';

            // Scene Setup
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0f172a, 0.035);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.copy(CAM_POS_ISO);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.target.copy(LOOK_AT_CENTER);

            // Lights
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 10, 7);
            dirLight.castShadow = true;
            scene.add(dirLight);
            
            // Grid - Lowered to prevent Z-fighting
            const gridHelper = new THREE.GridHelper(20, 20, 0x1e293b, 0x1e293b);
            gridHelper.position.y = -0.05; 
            scene.add(gridHelper);

            // Initial Load
            loadShape('prism');
            animate();

            // Resize
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // --- Core Logic: Load Shape ---
        function loadShape(key) {
            currentShapeKey = key;
            
            // UI Updates
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.nav-btn[data-shape="${key}"]`)?.classList.add('active');
            
            // Show/Hide Prism specific controls
            const prismControls = document.getElementById('prism-controls');
            if (key === 'prism') {
                prismControls.classList.remove('hidden');
                prismControls.classList.add('flex');
            } else {
                prismControls.classList.add('hidden');
                prismControls.classList.remove('flex');
            }

            // Button Visibility Logic
            const btnNet = document.getElementById('btn-net');
            const btnGen = document.getElementById('btn-gen');
            
            if (key === 'sphere') {
                btnNet.style.display = 'none';
                btnGen.classList.remove('hidden');
                btnGen.style.display = 'inline-block';
            } 
            else if (['cylinder', 'cone', 'frustum_circ'].includes(key)) {
                btnNet.style.display = 'inline-block';
                btnGen.classList.remove('hidden');
                btnGen.style.display = 'inline-block';
            }
            else {
                btnNet.style.display = 'inline-block';
                btnGen.classList.add('hidden');
                btnGen.style.display = 'none';
            }

            updateInfoPanel(geometryData[key]);
            
            // Force reset to solid view
            currentViewMode = 'solid';
            isGenAnimating = false;
            document.querySelectorAll('#view-controls .mode-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-solid').classList.add('active');
            isAutoRotate = true;
            document.getElementById('autoRotate').checked = true;

            rebuildScene('solid'); 
            moveCamera(CAM_POS_ISO, LOOK_AT_CENTER);
        }

        function setPrismType(type) {
            currentPrismType = type;
            document.querySelectorAll('#prism-controls .mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            if(currentViewMode === 'net') {
                rebuildScene('net');
                animateParts('open', 1000);
            } else if (currentViewMode === 'gen') {
                rebuildScene('solid');
            } else {
                rebuildScene('solid');
            }
        }

        function toggleViewMode(mode) {
            currentViewMode = mode;
            isGenAnimating = (mode === 'gen');

            document.querySelectorAll('#view-controls .mode-btn').forEach(btn => btn.classList.remove('active'));
            if(mode === 'solid') document.getElementById('btn-solid').classList.add('active');
            if(mode === 'net') document.getElementById('btn-net').classList.add('active');
            if(mode === 'gen') document.getElementById('btn-gen').classList.add('active');

            if (mode === 'net') {
                rebuildScene('net');
                animateParts('open', 2500);
                
                let camPos, lookAt;
                if (['cylinder', 'cone', 'frustum_circ'].includes(currentShapeKey)) {
                    camPos = CAM_POS_NET_ROT;
                    lookAt = new THREE.Vector3(0, 0, 4); 
                } else {
                    camPos = CAM_POS_NET_POLY;
                    lookAt = new THREE.Vector3(0, 0, 0);
                }
                
                moveCamera(camPos, lookAt);
                isAutoRotate = false;
                document.getElementById('autoRotate').checked = false;

            } else if (mode === 'gen') {
                genProgress = 0;
                rebuildScene('gen');
                moveCamera(CAM_POS_FRONT, new THREE.Vector3(0, 1.5, 0)); 
                isAutoRotate = false;
                document.getElementById('autoRotate').checked = false;

            } else {
                if (activeGroup && activeGroup.userData.isNet) {
                    animateParts('closed', 1500);
                    setTimeout(() => { if(currentViewMode === 'solid') rebuildScene('solid'); }, 1600);
                } else {
                    rebuildScene('solid');
                }
                moveCamera(CAM_POS_ISO, LOOK_AT_CENTER);
                isAutoRotate = true;
                document.getElementById('autoRotate').checked = true;
            }
        }

        function toggleAutoRotate(val) { isAutoRotate = val; }
        function toggleWireframe(val) { 
            isWireframe = val;
            updateWireframeState();
        }

        function updateWireframeState() {
            if (activeGroup) {
                activeGroup.traverse(child => {
                    if (child.userData.isGenPlane || child.userData.isAxis) return;
                    if (child.isMesh && child.material) {
                        child.material.wireframe = isWireframe;
                        child.material.opacity = isWireframe ? 0.2 : 0.9;
                    }
                });
            }
        }

        function clearScene() {
            if (activeGroup) {
                scene.remove(activeGroup);
                activeGroup.traverse(o => {
                    if (o.geometry) o.geometry.dispose();
                    if (o.material) {
                        if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
                        else o.material.dispose();
                    }
                });
                activeGroup = null;
            }
            unfoldTweens.forEach(t => t.stop());
            unfoldTweens = [];
        }

        function getCommonMaterial() {
            return new THREE.MeshPhysicalMaterial({
                color: COLOR_FACE,
                metalness: 0.1,
                roughness: 0.2,
                transparent: true,
                opacity: 0.9,
                side: THREE.DoubleSide,
                wireframe: isWireframe,
                polygonOffset: true,
                polygonOffsetFactor: 1, 
                polygonOffsetUnits: 1
            });
        }

        function rebuildScene(modeOverride) {
            clearScene();
            activeGroup = new THREE.Group();
            scene.add(activeGroup);

            const mat = getCommonMaterial();
            const mode = modeOverride || currentViewMode;

            if (mode === 'net') activeGroup.userData.isNet = true;

            if (mode === 'gen') {
                buildGenerationScene();
                return;
            }
            
            if (currentShapeKey === 'prism') buildPrism(mat, mode);
            else if (currentShapeKey === 'pyramid') buildPyramid(mat, mode);
            else if (currentShapeKey === 'frustum_poly') buildPolyFrustum(mat, mode);
            else if (currentShapeKey === 'cylinder') buildCylinder(mat, mode);
            else if (currentShapeKey === 'cone') buildCone(mat, mode);
            else if (currentShapeKey === 'frustum_circ') buildCircFrustum(mat, mode);
            else if (currentShapeKey === 'sphere') buildSphere(mat);
        }

        // --- Camera Animation ---
        function moveCamera(targetPos, lookAtPos) {
            new TWEEN.Tween(camera.position)
                .to({ x: targetPos.x, y: targetPos.y, z: targetPos.z }, 2000)
                .easing(TWEEN.Easing.Cubic.InOut)
                .onUpdate(() => controls.update())
                .start();
            
            const target = lookAtPos || new THREE.Vector3(0, 0, 0);
            new TWEEN.Tween(controls.target)
                .to({ x: target.x, y: target.y, z: target.z }, 2000)
                .easing(TWEEN.Easing.Cubic.InOut)
                .start();
        }

        // --- Part Animation System ---
        function animateParts(targetState, duration) {
            activeGroup.traverse(child => {
                const data = child.userData;
                if (data.isSide || data.isLid) {
                    const targetRot = targetState === 'open' ? data.openRot : data.closedRot;
                    const mesh = data.isLid ? child : child.children[0]; 
                    if (targetRot !== undefined && mesh) {
                        new TWEEN.Tween(mesh.rotation)
                            .to({ x: targetRot }, duration)
                            .easing(targetState === 'open' ? TWEEN.Easing.Back.Out : TWEEN.Easing.Cubic.InOut)
                            .delay(data.isLid && targetState === 'open' ? duration * 0.3 : 0)
                            .start();
                    }
                }
                if (data.isPart) {
                    const targetPos = targetState === 'open' ? data.openPos : data.closedPos;
                    if (targetPos) {
                         new TWEEN.Tween(child.position)
                            .to({ x: targetPos.x, y: targetPos.y, z: targetPos.z }, duration)
                            .easing(TWEEN.Easing.Cubic.InOut)
                            .start();
                    }
                }
            });
        }

        // --- Generation Animation ---
        function buildGenerationScene() {
            const axisGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, -5, 0), new THREE.Vector3(0, 5, 0)]);
            const axisMat = new THREE.LineDashedMaterial({ color: COLOR_AXIS, dashSize: 0.3, gapSize: 0.2 });
            const axisLine = new THREE.Line(axisGeo, axisMat);
            axisLine.computeLineDistances();
            axisLine.userData.isAxis = true;
            activeGroup.add(axisLine);

            const bodyGroup = new THREE.Group();
            bodyGroup.name = "genBodyGroup";
            activeGroup.add(bodyGroup);

            let genGeo;
            if (currentShapeKey === 'cylinder') {
                genGeo = new THREE.PlaneGeometry(1.5, 3);
                genGeo.translate(0.75, 1.5, 0); 
            } else if (currentShapeKey === 'cone') {
                const shape = new THREE.Shape();
                shape.moveTo(0, 0); shape.lineTo(1.5, 0); shape.lineTo(0, 3.5); shape.lineTo(0, 0);
                genGeo = new THREE.ShapeGeometry(shape);
            } else if (currentShapeKey === 'frustum_circ') {
                const shape = new THREE.Shape();
                shape.moveTo(0, 0); shape.lineTo(2, 0); shape.lineTo(1, 2.5); shape.lineTo(0, 2.5); shape.lineTo(0, 0);
                genGeo = new THREE.ShapeGeometry(shape);
            } else if (currentShapeKey === 'sphere') {
                const shape = new THREE.Shape();
                shape.absarc(0, 0, 2, -Math.PI/2, Math.PI/2, false);
                shape.lineTo(0, -2); 
                genGeo = new THREE.ShapeGeometry(shape);
                genGeo.translate(0, 2, 0); 
            }

            const genMat = new THREE.MeshBasicMaterial({ color: COLOR_GEN_PLANE, side: THREE.DoubleSide, transparent: true, opacity: 0.6 });
            const genMesh = new THREE.Mesh(genGeo, genMat);
            genMesh.name = "genPlane";
            genMesh.userData.isGenPlane = true;
            
            const edges = new THREE.EdgesGeometry(genGeo);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xffffff }));
            genMesh.add(line);

            activeGroup.add(genMesh);
        }

        function updateGenerationFrame() {
            if (currentViewMode !== 'gen' || !activeGroup) return;
            genProgress += genSpeed;
            if (genProgress > 1.2) genProgress = 0; 
            const effectiveProgress = Math.min(genProgress, 1);
            const angle = effectiveProgress * Math.PI * 2;
            const plane = activeGroup.getObjectByName("genPlane");
            if (plane) plane.rotation.y = -angle;
            const bodyGroup = activeGroup.getObjectByName("genBodyGroup");
            if (bodyGroup && effectiveProgress > 0.01) {
                if(bodyGroup.children.length > 0) {
                    const old = bodyGroup.children[0];
                    old.geometry.dispose();
                    bodyGroup.remove(old);
                }
                let geo;
                const mat = getCommonMaterial();
                mat.side = THREE.DoubleSide; 
                if (currentShapeKey === 'cylinder') {
                    geo = new THREE.CylinderGeometry(1.5, 1.5, 3, 32, 1, false, 0, angle);
                    geo.translate(0, 1.5, 0);
                } else if (currentShapeKey === 'cone') {
                    geo = new THREE.ConeGeometry(1.5, 3.5, 32, 1, false, 0, angle);
                    geo.translate(0, 1.75, 0); 
                } else if (currentShapeKey === 'frustum_circ') {
                    geo = new THREE.CylinderGeometry(1, 2, 2.5, 32, 1, false, 0, angle);
                    geo.translate(0, 1.25, 0);
                } else if (currentShapeKey === 'sphere') {
                    geo = new THREE.SphereGeometry(2, 32, 16, 0, angle);
                    geo.translate(0, 2, 0);
                }
                const mesh = new THREE.Mesh(geo, mat);
                mesh.rotation.y = 0; 
                if (plane) plane.rotation.y = angle; 
                bodyGroup.add(mesh);
                addEdge(mesh, geo);
            }
        }

        // --- Geometry Builders ---
        function buildPrism(material, mode) {
            let w, d, h;
            if (currentPrismType === 'regular') {
                w = 1.8; d = 1.8; h = 3; 
            } else if (currentPrismType === 'right' || currentPrismType === 'oblique') {
                w = 2.2; d = 1.4; h = 3; 
            } else {
                w = 2; d = 1.5; h = 3; 
            }

            if (mode === 'solid') {
                let geo = new THREE.BoxGeometry(w, h, d);
                geo.translate(0, h/2, 0);

                if (currentPrismType === 'oblique') {
                    const shearM = new THREE.Matrix4().makeShear(0.5, 0, 0, 0, 0, 0);
                    geo.applyMatrix4(shearM);
                }

                const mesh = new THREE.Mesh(geo, material);
                activeGroup.add(mesh);
                addEdge(mesh, geo);
            } 
            else {
                // NET MODE
                const baseGeo = new THREE.PlaneGeometry(w, d);
                baseGeo.rotateX(-Math.PI / 2); 
                const baseMesh = new THREE.Mesh(baseGeo, material);
                activeGroup.add(baseMesh);
                addEdge(baseMesh, baseGeo);

                const faces = [
                    { type: 'FB', w: w, h: h, x: 0, z: d/2, ry: 0 },      
                    { type: 'FB', w: w, h: h, x: 0, z: -d/2, ry: Math.PI }, 
                    { type: 'LR', w: d, h: h, x: -w/2, z: 0, ry: -Math.PI/2 }, 
                    { type: 'LR', w: d, h: h, x: w/2, z: 0, ry: Math.PI/2 }   
                ];

                const shearX = (currentPrismType === 'oblique') ? 0.5 * h : 0;
                // Calculate actual slant height for LR faces
                const slantHeight = Math.sqrt(h*h + shearX*shearX);
                // Calculate tilt angle for LR faces (from vertical 0)
                // When solid leans +X, the left/right faces tilt "back" if viewed from Z?
                // Left face (at -w/2) is perpendicular to X. X shifts. It tilts.
                // The tilt angle around Z-axis (local X) is atan(shearX/h).
                // Let's deduce sign: Solid moves +X at top. 
                // Left Face: Base at X=-w/2. Top at X=-w/2+sh.
                // Rotated -90 around Y. Local X is World Z. Local Y is World Y. Local Z is World X.
                // Face plane is Normal to Local Z.
                // Solid shear moves vertices in Local Z (World X).
                // So this face tilts around Local X (World Z)? No.
                // The face bottom is at (x,0,z). Top at (x+sh, h, z).
                // In local frame (where base edge is X-axis), height is Y.
                // The shift is PERPENDICULAR to the face plane?
                // Left Face: Plane X=-w/2. Shear is along X.
                // So the top edge moves OUT of the original plane.
                // This means the face tilts.
                // The closed angle is Math.atan2(shearX, h).
                const tiltAngle = Math.atan2(shearX, h);

                faces.forEach((f, i) => {
                    const pivotGroup = new THREE.Group();
                    pivotGroup.position.set(f.x, 0, f.z);
                    pivotGroup.rotation.y = f.ry;

                    let faceGeo;
                    let closedRot = 0;

                    if (currentPrismType === 'oblique') {
                        if (f.type === 'FB') {
                            // Front/Back faces are sheared in their own plane -> Parallelogram
                            const shape = new THREE.Shape();
                            shape.moveTo(-f.w/2, 0);
                            shape.lineTo(f.w/2, 0);
                            shape.lineTo(f.w/2 + shearX, h);
                            shape.lineTo(-f.w/2 + shearX, h);
                            shape.lineTo(-f.w/2, 0);
                            faceGeo = new THREE.ShapeGeometry(shape);
                            // They remain vertical
                            closedRot = 0;
                        } else {
                            // Left/Right faces are rectangles but tilted
                            // Height becomes slantHeight
                            faceGeo = new THREE.PlaneGeometry(f.w, slantHeight);
                            faceGeo.translate(0, slantHeight/2, 0);
                            // Determine tilt direction.
                            // Left Face (ry = -PI/2): Local Z is World X.
                            // Top moves +X (Local +Z).
                            // Rotation around Local X (Base edge).
                            // Positive rotation X moves top to -Z (Local) -> -WorldX? No.
                            // Right Hand Rule: Thumb on X. Fingers curl Y -> Z.
                            // +RotX moves Y axis towards Z axis.
                            // So +RotX moves top towards Local +Z (World +X).
                            // So Left Face needs +tiltAngle.
                            // Right Face (ry = PI/2): Local Z is World -X.
                            // Top moves +X (Local -Z).
                            // +RotX moves top towards Local +Z (World -X).
                            // -RotX moves top towards Local -Z (World +X).
                            // So Right Face needs -tiltAngle.
                            if (f.ry === -Math.PI/2) closedRot = tiltAngle;
                            else closedRot = -tiltAngle;
                        }
                    } else {
                        faceGeo = new THREE.PlaneGeometry(f.w, h);
                        faceGeo.translate(0, h/2, 0);
                        closedRot = 0;
                    }

                    const face = new THREE.Mesh(faceGeo, material);
                    addEdge(face, faceGeo);
                    
                    pivotGroup.userData = { isSide: true, closedRot: closedRot, openRot: -Math.PI/2 };
                    face.rotation.x = closedRot; 

                    pivotGroup.add(face);
                    activeGroup.add(pivotGroup);

                    // Attach Top Lid to Back Face (index 1)
                    if (i === 1) { 
                        const topPivot = new THREE.Group();
                        // Position at top of the face (shifted if oblique)
                        topPivot.position.set(shearX, h, 0);
                        
                        const topGeo = new THREE.PlaneGeometry(w, d);
                        topGeo.translate(0, d/2, 0); 
                        
                        const topMesh = new THREE.Mesh(topGeo, material);
                        
                        topPivot.add(topMesh);
                        face.add(topPivot);
                        
                        // Lid Anim: Closed is relative to side.
                        // Side is Vertical (0). Lid is Horizontal (-90).
                        // Open is -PI/2? No.
                        // If side is flat (-90), lid should be flat on ground.
                        // Lid attached to top of side.
                        // Side flat: Top is at Z = -h.
                        // Lid needs to extend further Z.
                        // Side is at -90. Lid needs to be collinear (0 deg relative to side).
                        // So openRot = 0.
                        topPivot.userData = { isLid: true, closedRot: -Math.PI/2, openRot: 0 };
                        topPivot.rotation.x = -Math.PI/2; 
                        
                        addEdge(topMesh, topGeo);
                    }
                });
            }
        }

        function buildPyramid(material, mode) {
            const sideCount = 4; const radius = 2; const height = 3;
            const baseGeo = new THREE.CircleGeometry(radius, sideCount, Math.PI/4);
            const baseMesh = new THREE.Mesh(baseGeo, material);
            baseMesh.rotation.x = -Math.PI / 2;
            activeGroup.add(baseMesh);
            addEdge(baseMesh, baseGeo);

            if (mode === 'solid') {
                const geo = new THREE.ConeGeometry(radius, height, sideCount);
                const mesh = new THREE.Mesh(geo, material);
                mesh.position.y = height/2; 
                baseMesh.position.y = 0;
                activeGroup.add(mesh);
                addEdge(mesh, geo);
                baseMesh.visible = false;
            } else {
                const sideWidth = radius * Math.sqrt(2);
                const slantHeight = Math.sqrt((sideWidth/2)**2 + height**2);
                for (let i = 0; i < sideCount; i++) {
                    const pivotGroup = new THREE.Group();
                    const angle = i * (Math.PI/2);
                    const dist = sideWidth/2;
                    pivotGroup.position.set(Math.cos(angle)*dist, 0, Math.sin(angle)*dist);
                    pivotGroup.rotation.y = -angle - Math.PI/2;
                    const shape = new THREE.Shape();
                    shape.moveTo(-sideWidth/2, 0); shape.lineTo(sideWidth/2, 0);
                    shape.lineTo(0, slantHeight); shape.lineTo(-sideWidth/2, 0);
                    const faceGeo = new THREE.ShapeGeometry(shape);
                    const face = new THREE.Mesh(faceGeo, material);
                    const angleFromVert = Math.atan2(sideWidth/2, height);
                    pivotGroup.userData = { isSide: true, closedRot: angleFromVert, openRot: -Math.PI/2 };
                    face.rotation.x = angleFromVert; 
                    addEdge(face, faceGeo);
                    pivotGroup.add(face);
                    activeGroup.add(pivotGroup);
                }
            }
        }

        function buildCylinder(material, mode) {
            if (mode === 'solid') {
                const geo = new THREE.CylinderGeometry(1.5, 1.5, 3, 32);
                const mesh = new THREE.Mesh(geo, material);
                mesh.position.y = 1.5; 
                activeGroup.add(mesh);
                addEdge(mesh, geo);
            } else {
                buildNetForRotation(1.5, 1.5, 3, 'rect');
            }
        }

        function buildCone(material, mode) {
            const r = 1.5; const h = 3.5;
            if (mode === 'solid') {
                const geo = new THREE.ConeGeometry(r, h, 32);
                const mesh = new THREE.Mesh(geo, material);
                mesh.position.y = h/2;
                activeGroup.add(mesh);
                addEdge(mesh, geo);
            } else {
                buildNetForRotation(r, 0, h, 'sector');
            }
        }

        function buildPolyFrustum(material, mode) {
             const bottomR = 2; const topR = 1; const h = 2.5;
             const sideW_bot = bottomR * Math.sqrt(2);
             const sideW_top = topR * Math.sqrt(2);
             const slantH = Math.sqrt(((sideW_bot - sideW_top)/2)**2 + h**2);
            if (mode === 'solid') {
                const geo = new THREE.CylinderGeometry(1, 2, 2.5, 4);
                const mesh = new THREE.Mesh(geo, material);
                mesh.position.y = 1.25; 
                activeGroup.add(mesh);
                addEdge(mesh, geo);
            } else {
                const baseGeo = new THREE.PlaneGeometry(sideW_bot, sideW_bot);
                const base = new THREE.Mesh(baseGeo, material);
                base.rotation.x = -Math.PI/2;
                activeGroup.add(base);
                addEdge(base, baseGeo);
                const topGeo = new THREE.PlaneGeometry(sideW_top, sideW_top);
                const top = new THREE.Mesh(topGeo, material);
                top.rotation.x = -Math.PI/2;
                const openZ = -sideW_bot/2 - sideW_top/2 - slantH - 0.5;
                top.userData = { isPart: true, closedPos: new THREE.Vector3(0, h, 0), openPos: new THREE.Vector3(0, 0, openZ) };
                top.position.set(0, h, 0); 
                activeGroup.add(top);
                addEdge(top, topGeo);
                for(let i=0; i<4; i++) {
                     const pivotGroup = new THREE.Group();
                     const angle = i * Math.PI/2;
                     const dist = sideW_bot/2;
                     pivotGroup.position.set(Math.cos(angle)*dist, 0, Math.sin(angle)*dist);
                     pivotGroup.rotation.y = -angle - Math.PI/2;
                     const shape = new THREE.Shape();
                     shape.moveTo(-sideW_bot/2, 0); shape.lineTo(sideW_bot/2, 0);
                     shape.lineTo(sideW_top/2, slantH); shape.lineTo(-sideW_top/2, slantH);
                     const trapGeo = new THREE.ShapeGeometry(shape);
                     const mesh = new THREE.Mesh(trapGeo, material);
                     const angleFromVert = Math.atan2((sideW_bot - sideW_top)/2, h);
                     pivotGroup.userData = { isSide: true, closedRot: angleFromVert, openRot: -Math.PI/2 };
                     mesh.rotation.x = angleFromVert; 
                     pivotGroup.add(mesh);
                     activeGroup.add(pivotGroup);
                     addEdge(mesh, trapGeo);
                }
            }
        }

        function buildCircFrustum(material, mode) {
            if (mode === 'solid') {
                const geo = new THREE.CylinderGeometry(1, 2, 2.5, 32);
                const mesh = new THREE.Mesh(geo, material);
                mesh.position.y = 1.25; 
                activeGroup.add(mesh);
                addEdge(mesh, geo);
            } else {
                buildNetForRotation(2, 1, 2.5, 'annulus');
            }
        }

        function buildSphere(material, mode) {
             const geo = new THREE.SphereGeometry(2, 32, 32);
             const mesh = new THREE.Mesh(geo, material);
             mesh.position.y = 2; 
             activeGroup.add(mesh);
             addEdge(mesh, geo);
        }

        function buildNetForRotation(rBottom, rTop, h, type) {
            const group = new THREE.Group();
            const c1 = new THREE.Mesh(new THREE.CircleGeometry(rBottom, 64), getCommonMaterial());
            c1.rotation.x = -Math.PI/2;
            group.add(c1);
            addEdge(c1, c1.geometry);
            let latGeo, latMesh;
            let R_outer = 0, R_inner = 0;
            if (type === 'rect') {
                const w = 2 * Math.PI * rBottom;
                latGeo = new THREE.PlaneGeometry(w, h);
                latMesh = new THREE.Mesh(latGeo, getCommonMaterial());
                latMesh.rotation.x = -Math.PI/2;
                const padding = 0.5;
                const rectStartZ = rBottom + padding;
                const rectCenterZ = rectStartZ + h/2; 
                latMesh.userData = { isPart: true, closedPos: new THREE.Vector3(0, h/2, 0), openPos: new THREE.Vector3(0, 0, rectCenterZ) };
                latMesh.position.set(0, h/2, 0); 
                group.add(latMesh);
                addEdge(latMesh, latGeo);
                const c2 = new THREE.Mesh(new THREE.CircleGeometry(rBottom, 64), getCommonMaterial());
                c2.rotation.x = -Math.PI/2;
                const topCircleZ = rectStartZ + h + padding + rBottom;
                c2.userData = { isPart: true, closedPos: new THREE.Vector3(0, h, 0), openPos: new THREE.Vector3(0, 0, topCircleZ) };
                c2.position.set(0, h, 0); 
                group.add(c2);
                addEdge(c2, c2.geometry);
            } else if (type === 'sector' || type === 'annulus') {
                const l = Math.sqrt((rBottom - rTop)**2 + h**2);
                const circum = 2 * Math.PI * rBottom;
                const theta = circum / l; 
                const shape = new THREE.Shape();
                R_outer = rTop === 0 ? l : l * rBottom / (rBottom - rTop);
                R_inner = rTop === 0 ? 0 : R_outer - l;
                if (type === 'annulus') {
                    shape.absarc(0, 0, R_inner, -theta/2 - Math.PI/2, theta/2 - Math.PI/2, false);
                    shape.absarc(0, 0, R_outer, theta/2 - Math.PI/2, -theta/2 - Math.PI/2, true);
                    shape.closePath();
                } else {
                    shape.moveTo(0, 0);
                    shape.absarc(0, 0, R_outer, theta/2 - Math.PI/2, -theta/2 - Math.PI/2, true);
                    shape.lineTo(0, 0); 
                }
                latGeo = new THREE.ShapeGeometry(shape);
                latMesh = new THREE.Mesh(latGeo, getCommonMaterial());
                latMesh.rotation.x = -Math.PI/2;
                const padding = 0.5;
                const visualStartOffset = R_inner;
                const finalZ = rBottom + padding - visualStartOffset;
                latMesh.userData = { isPart: true, closedPos: new THREE.Vector3(0, h/2, 0), openPos: new THREE.Vector3(0, 0, finalZ) };
                latMesh.position.set(0, h/2, 0);
                group.add(latMesh);
                addEdge(latMesh, latGeo);
                if (rTop > 0) {
                    const c2 = new THREE.Mesh(new THREE.CircleGeometry(rTop, 32), getCommonMaterial());
                    c2.rotation.x = -Math.PI/2;
                    const topCircleZ = finalZ + R_outer + padding + rTop;
                    c2.userData = { isPart: true, closedPos: new THREE.Vector3(0, h, 0), openPos: new THREE.Vector3(0, 0, topCircleZ) };
                    c2.position.set(0, h, 0);
                    group.add(c2);
                    addEdge(c2, c2.geometry);
                }
            }
            activeGroup.add(group);
        }

        function addEdge(mesh, geo) {
            const edges = new THREE.EdgesGeometry(geo);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: COLOR_EDGE }));
            mesh.add(line);
        }

        // --- Standard Loop ---
        function animate() {
            requestAnimationFrame(animate);
            TWEEN.update();
            controls.update();
            if (isAutoRotate && activeGroup) activeGroup.rotation.y += 0.005;
            if (isGenAnimating) updateGenerationFrame();
            renderer.render(scene, camera);
        }

        // --- Helper: UI Update ---
        function updateInfoPanel(data) {
            document.getElementById('shape-title').innerText = data.title;
            let html = `
                <div class="mb-6">
                    <h3 class="text-blue-300 font-bold text-xl mb-2">定义</h3>
                    <p class="text-xl text-gray-300 leading-loose border-l-4 border-blue-500 pl-3">${data.definition}</p>
                </div>
                <div class="mb-6">
                    <h3 class="text-blue-300 font-bold text-xl mb-2">结构特征</h3>
                    <ul class="list-disc list-inside text-xl text-gray-300 space-y-2 leading-relaxed">
                        ${data.features.map(f => `<li>${f}</li>`).join('')}
                    </ul>
                </div>
                <div>
                    <h3 class="text-blue-300 font-bold text-xl mb-2">公式</h3>
                    <div class="bg-slate-800 bg-opacity-80 p-5 rounded-lg border border-slate-700">
            `;
            for (const [key, val] of Object.entries(data.formulas)) {
                if (key === 'note') {
                    html += `<p class="text-lg text-gray-400 mt-3 italic border-t border-gray-600 pt-2">${val}</p>`;
                } else {
                    html += `<div class="math-display text-2xl">$$${val}$$</div>`;
                }
            }
            html += `</div></div>`;
            document.getElementById('shape-content').innerHTML = html;
            if (window.MathJax) MathJax.typesetPromise();
        }

        window.onload = init;

    </script>
</body>
