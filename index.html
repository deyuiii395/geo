<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高中数学：空间几何体交互教学</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MathJax for LaTeX Formulas -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: {
                fontCache: 'global'
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <!-- Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- TWEEN.js used for smooth animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 0; }
        
        /* Glassmorphism UI Panels */
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 3px; }

        .nav-btn {
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }
        .nav-btn:hover { background: rgba(59, 130, 246, 0.1); border-left-color: #60a5fa; padding-left: 1rem; }
        .nav-btn.active { background: rgba(37, 99, 235, 0.2); border-left-color: #3b82f6; color: #fff; padding-left: 1rem; }

        .math-display {
            font-size: 1.1em;
            margin: 10px 0;
            color: #93c5fd;
        }

        #loading-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #3b82f6;
            font-size: 1.2rem;
            z-index: 5;
            text-align: center;
        }

        /* Toggle Switch */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #3b82f6;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #3b82f6;
        }

        /* Mode Controls */
        .mode-btn {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            color: #94a3b8;
        }
        .mode-btn.active {
            background: #2563eb;
            color: white;
            border-color: #3b82f6;
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.4);
        }
        .mode-btn:hover:not(.active) {
            background: rgba(59, 130, 246, 0.2);
        }
    </style>
</head>
<body>

    <!-- Loading Indicator -->
    <div id="loading-overlay">
        正在加载 3D 引擎资源...<br>
        <span style="font-size: 0.8rem; color: #64748b;">如果长时间无法显示，请检查网络或代理设置</span>
    </div>

    <!-- 3D Canvas -->
    <div id="canvas-container"></div>

    <!-- Top Control Bar (Dynamic based on selection) -->
    <div class="absolute top-4 left-72 z-20 flex gap-4" id="top-controls">
        <!-- Prism Type Controls (Only visible for prism) -->
        <div id="prism-controls" class="glass-panel rounded-lg p-2 flex gap-2 hidden">
            <button class="mode-btn active" onclick="setPrismType('right')">直棱柱</button>
            <button class="mode-btn" onclick="setPrismType('oblique')">斜棱柱</button>
        </div>

        <!-- View Mode Controls (Solid vs Net) -->
        <div id="view-controls" class="glass-panel rounded-lg p-2 flex gap-2">
            <button class="mode-btn active" id="btn-solid" onclick="toggleViewMode('solid')">立体模型</button>
            <button class="mode-btn" id="btn-net" onclick="toggleViewMode('net')">展开演示</button>
        </div>
    </div>

    <!-- Left Sidebar: Controls -->
    <div class="absolute top-0 left-0 h-full w-64 glass-panel flex flex-col z-10 transform transition-transform duration-300" id="sidebar">
        <div class="p-6 border-b border-gray-700">
            <h1 class="text-xl font-bold text-blue-400">空间几何体</h1>
            <p class="text-xs text-gray-400 mt-1">高三数学一轮复习</p>
        </div>
        
        <div class="flex-1 overflow-y-auto py-4">
            <div class="px-4 text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">简单多面体</div>
            <button class="nav-btn active w-full text-left px-6 py-3 text-sm" data-shape="prism" onclick="loadShape('prism')">棱柱 (Prism)</button>
            <button class="nav-btn w-full text-left px-6 py-3 text-sm" data-shape="pyramid" onclick="loadShape('pyramid')">棱锥 (Pyramid)</button>
            <button class="nav-btn w-full text-left px-6 py-3 text-sm" data-shape="frustum_poly" onclick="loadShape('frustum_poly')">棱台 (Frustum)</button>
            
            <div class="px-4 text-xs font-semibold text-gray-500 uppercase tracking-wider mt-6 mb-2">旋转体</div>
            <button class="nav-btn w-full text-left px-6 py-3 text-sm" data-shape="cylinder" onclick="loadShape('cylinder')">圆柱 (Cylinder)</button>
            <button class="nav-btn w-full text-left px-6 py-3 text-sm" data-shape="cone" onclick="loadShape('cone')">圆锥 (Cone)</button>
            <button class="nav-btn w-full text-left px-6 py-3 text-sm" data-shape="frustum_circ" onclick="loadShape('frustum_circ')">圆台 (Frustum)</button>
            <button class="nav-btn w-full text-left px-6 py-3 text-sm" data-shape="sphere" onclick="loadShape('sphere')">球 (Sphere)</button>
        </div>

        <div class="p-4 border-t border-gray-700">
            <div class="flex items-center justify-between mb-2">
                <span class="text-sm">自动旋转</span>
                <input type="checkbox" id="autoRotate" checked class="toggle-checkbox" onchange="toggleAutoRotate(this.checked)">
            </div>
            <div class="flex items-center justify-between">
                <span class="text-sm">透视模式</span>
                <input type="checkbox" id="wireframeToggle" class="toggle-checkbox" onchange="toggleWireframe(this.checked)">
            </div>
            <div class="mt-4 text-xs text-gray-500 text-center">
                拖动鼠标旋转 · 滚轮缩放
            </div>
        </div>
    </div>

    <!-- Right Panel: Info & Formulas -->
    <div class="absolute top-4 right-4 w-96 glass-panel rounded-lg p-6 z-10 max-h-[90vh] overflow-y-auto shadow-2xl">
        <h2 id="shape-title" class="text-2xl font-bold text-white mb-2">正六棱柱</h2>
        <div class="w-16 h-1 bg-blue-500 mb-4 rounded"></div>
        
        <div id="shape-content" class="space-y-6">
            <!-- Content will be injected here via JS -->
        </div>
    </div>

    <script>
        // --- Geometry Data & Educational Content ---
        const geometryData = {
            prism: {
                title: "棱柱 (Prism)",
                definition: "有两个面互相平行，其余各面都是四边形，并且每相邻两个四边形的公共边都互相平行。",
                features: [
                    "<strong>直棱柱：</strong>侧棱垂直于底面的棱柱。",
                    "<strong>斜棱柱：</strong>侧棱不垂直于底面的棱柱。",
                    "<strong>正棱柱：</strong>底面是正多边形的直棱柱。",
                    "<strong>展开图：</strong>由两个底面多边形和侧面矩形（或平行四边形）组成。"
                ],
                formulas: {
                    area: "S_{表面} = S_{侧} + 2S_{底}",
                    volume: "V = S_{底}h",
                    lateral: "S_{直棱柱侧} = ch"
                },
                type: 'prism'
            },
            pyramid: {
                title: "棱锥 (Pyramid)",
                definition: "有一个面是多边形，其余各面都是有一个公共顶点的三角形。",
                features: [
                    "<strong>正棱锥：</strong>底面是正多边形，顶点在底面的射影是中心。",
                    "<strong>展开图：</strong>由一个底面多边形和多个侧面三角形组成，呈现星形或放射状。"
                ],
                formulas: {
                    area: "S_{表面} = S_{侧} + S_{底}",
                    volume: "V = \\frac{1}{3}S_{底}h",
                    lateral: "S_{正棱锥侧} = \\frac{1}{2}ch'"
                },
                type: 'pyramid'
            },
            frustum_poly: {
                title: "棱台 (Frustum of Prism)",
                definition: "用一个平行于棱锥底面的平面去截棱锥，底面和截面之间的部分。",
                features: [
                    "上、下底面互相平行且相似。",
                    "<strong>展开图：</strong>由大小两个底面多边形和多个侧面梯形组成。"
                ],
                formulas: {
                    volume: "V = \\frac{1}{3}(S_{上} + S_{下} + \\sqrt{S_{上}S_{下}})h",
                    note: "体积公式“万能公式”：$V=\\frac{h}{6}(S_{上}+4S_{中}+S_{下})$"
                },
                type: 'frustum_poly'
            },
            cylinder: {
                title: "圆柱 (Cylinder)",
                definition: "以矩形的一边所在直线为旋转轴，其余三边旋转形成的面所围成的旋转体。",
                features: [
                    "<strong>展开图：</strong>侧面展开是一个矩形，长为底面周长 $2\\pi r$，宽为高 $h$。加上两个底面圆。",
                    "轴截面是矩形。"
                ],
                formulas: {
                    lateral: "S_{侧} = 2\\pi rh",
                    area: "S_{表} = 2\\pi r(r+h)",
                    volume: "V = \\pi r^2 h"
                },
                type: 'cylinder'
            },
            cone: {
                title: "圆锥 (Cone)",
                definition: "以直角三角形的一条直角边所在直线为旋转轴，其余两边旋转形成的面所围成的旋转体。",
                features: [
                    "<strong>展开图：</strong>侧面展开是一个扇形，半径为母线 $l$，弧长为 $2\\pi r$。加上一个底面圆。",
                    "轴截面是等腰三角形。"
                ],
                formulas: {
                    lateral: "S_{侧} = \\pi rl",
                    area: "S_{表} = \\pi r(l+r)",
                    volume: "V = \\frac{1}{3}\\pi r^2 h"
                },
                type: 'cone'
            },
            frustum_circ: {
                title: "圆台 (Frustum of Cone)",
                definition: "用平行于圆锥底面的平面去截圆锥，底面和截面之间的部分。",
                features: [
                    "<strong>展开图：</strong>侧面展开是一个扇环。加上大小两个底面圆。",
                    "轴截面是等腰梯形。"
                ],
                formulas: {
                    lateral: "S_{侧} = \\pi(r_1 + r_2)l",
                    volume: "V = \\frac{1}{3}\\pi(r_1^2 + r_2^2 + r_1r_2)h"
                },
                type: 'frustum_circ'
            },
            sphere: {
                title: "球 (Sphere)",
                definition: "以半圆的直径所在直线为旋转轴，半圆面旋转一周形成的几何体。",
                features: [
                    "球是不可展曲面，无法在平面上完全无损展开（类似于剥橘子皮，总有撕裂或重叠）。",
                    "地图制作中的“投影”即是为了解决此问题。"
                ],
                formulas: {
                    area: "S = 4\\pi R^2",
                    volume: "V = \\frac{4}{3}\\pi R^3"
                },
                type: 'sphere'
            }
        };

        // --- Global State ---
        let scene, camera, renderer, controls;
        let currentShapeKey = 'prism';
        let currentPrismType = 'right'; // 'right' or 'oblique'
        let currentViewMode = 'solid'; // 'solid' or 'net'
        
        let activeGroup = null; // Container for the current shape parts
        let unfoldTweens = []; // Array of tween objects

        let isWireframe = false;
        let isAutoRotate = true;

        // Colors
        const COLOR_FACE = 0x3b82f6;
        const COLOR_FACE_INNER = 0x2563eb;
        const COLOR_EDGE = 0x93c5fd;

        // Camera presets
        const CAM_POS_ISO = new THREE.Vector3(6, 5, 6);
        const CAM_POS_TOP = new THREE.Vector3(0, 9, 0);

        function init() {
            if (typeof THREE === 'undefined') {
                document.getElementById('loading-overlay').innerHTML = '<span style="color: #ef4444;">资源加载失败，请刷新或检查网络。</span>';
                return;
            }
            document.getElementById('loading-overlay').style.display = 'none';

            // Scene Setup
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0f172a, 0.035);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.copy(CAM_POS_ISO);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // Lights
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 10, 7);
            dirLight.castShadow = true;
            scene.add(dirLight);
            
            // Grid
            const gridHelper = new THREE.GridHelper(20, 20, 0x1e293b, 0x1e293b);
            scene.add(gridHelper);

            // Initial Load
            loadShape('prism');
            animate();

            // Resize
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // --- Core Logic: Load Shape ---
        function loadShape(key) {
            currentShapeKey = key;
            
            // UI Updates
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.nav-btn[data-shape="${key}"]`)?.classList.add('active');
            
            // Show/Hide Prism specific controls
            const prismControls = document.getElementById('prism-controls');
            if (key === 'prism') {
                prismControls.classList.remove('hidden');
                prismControls.classList.add('flex');
            } else {
                prismControls.classList.add('hidden');
                prismControls.classList.remove('flex');
            }

            // Show/Hide Unfold button (Sphere cannot unfold)
            const btnNet = document.getElementById('btn-net');
            if (key === 'sphere') {
                if (currentViewMode === 'net') toggleViewMode('solid'); 
                btnNet.style.display = 'none';
            } else {
                btnNet.style.display = 'inline-block';
            }

            updateInfoPanel(geometryData[key]);
            
            // Reset to solid view when changing shape for consistency
            currentViewMode = 'solid';
            document.getElementById('btn-solid').classList.add('active');
            document.getElementById('btn-net').classList.remove('active');
            moveCamera(CAM_POS_ISO);
            
            rebuildScene('solid'); 
        }

        function setPrismType(type) {
            currentPrismType = type;
            document.querySelectorAll('#prism-controls .mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // Rebuild in current mode
            if(currentViewMode === 'net') {
                // If in net mode, rebuild closed then animate open instantly? 
                // Better: rebuild closed, then animate open.
                rebuildScene('net');
                animateParts('open', 1000);
            } else {
                rebuildScene('solid');
            }
        }

        function toggleViewMode(mode) {
            if (mode === currentViewMode) return;
            currentViewMode = mode;

            // UI Toggle
            document.querySelectorAll('#view-controls .mode-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(mode === 'solid' ? 'btn-solid' : 'btn-net').classList.add('active');

            if (mode === 'net') {
                // 1. Switch to Net Geometry (built in Closed state)
                rebuildScene('net');
                // 2. Animate to Open State
                animateParts('open', 2500);
                // 3. Move Camera to Top View
                moveCamera(CAM_POS_TOP);
                // 4. Disable AutoRotate for better inspection
                isAutoRotate = false;
                document.getElementById('autoRotate').checked = false;

            } else {
                // Solid Mode Requested
                // 1. Animate back to Closed State (Fold)
                animateParts('closed', 1500);
                // 2. Move Camera back to Isometric
                moveCamera(CAM_POS_ISO);
                // 3. Enable AutoRotate (optional, good for "display")
                isAutoRotate = true;
                document.getElementById('autoRotate').checked = true;

                // 4. After animation, swap to true Solid Mesh for perfection (optional but cleaner)
                // We use a timeout roughly matching the animation duration
                setTimeout(() => {
                    if(currentViewMode === 'solid') rebuildScene('solid');
                }, 1600);
            }
        }

        function toggleAutoRotate(val) { isAutoRotate = val; }
        function toggleWireframe(val) { 
            isWireframe = val;
            updateWireframeState();
        }

        function updateWireframeState() {
            if (activeGroup) {
                activeGroup.traverse(child => {
                    if (child.isMesh && child.material) {
                        child.material.wireframe = isWireframe;
                        child.material.opacity = isWireframe ? 0.2 : 0.9;
                    }
                });
            }
        }

        // --- 3D Scene Management ---

        function clearScene() {
            if (activeGroup) {
                scene.remove(activeGroup);
                activeGroup.traverse(o => {
                    if (o.geometry) o.geometry.dispose();
                    if (o.material) {
                        if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
                        else o.material.dispose();
                    }
                });
                activeGroup = null;
            }
            unfoldTweens.forEach(t => t.stop());
            unfoldTweens = [];
        }

        function getCommonMaterial() {
            return new THREE.MeshPhysicalMaterial({
                color: COLOR_FACE,
                metalness: 0.1,
                roughness: 0.2,
                transparent: true,
                opacity: 0.9,
                side: THREE.DoubleSide,
                wireframe: isWireframe
            });
        }

        function rebuildScene(modeOverride) {
            clearScene();
            activeGroup = new THREE.Group();
            scene.add(activeGroup);

            const mat = getCommonMaterial();
            const mode = modeOverride || currentViewMode;

            // Important: "Net" mode builds the shape in its CLOSED (assembled) state initially,
            // ready to be animated open.
            
            if (currentShapeKey === 'prism') buildPrism(mat, mode);
            else if (currentShapeKey === 'pyramid') buildPyramid(mat, mode);
            else if (currentShapeKey === 'frustum_poly') buildPolyFrustum(mat, mode);
            else if (currentShapeKey === 'cylinder') buildCylinder(mat, mode);
            else if (currentShapeKey === 'cone') buildCone(mat, mode);
            else if (currentShapeKey === 'frustum_circ') buildCircFrustum(mat, mode);
            else if (currentShapeKey === 'sphere') buildSphere(mat);
        }

        // --- Camera Animation ---
        function moveCamera(targetPos) {
            new TWEEN.Tween(camera.position)
                .to({ x: targetPos.x, y: targetPos.y, z: targetPos.z }, 2000)
                .easing(TWEEN.Easing.Cubic.InOut)
                .onUpdate(() => controls.update())
                .start();
                
            // Also reset target to center
            new TWEEN.Tween(controls.target)
                .to({ x: 0, y: 0, z: 0 }, 2000)
                .easing(TWEEN.Easing.Cubic.InOut)
                .start();
        }

        // --- Part Animation System ---
        function animateParts(targetState, duration) {
            // targetState: 'open' or 'closed'
            activeGroup.traverse(child => {
                const data = child.userData;
                
                // Rotation Animation (Polyhedra)
                if (data.isSide || data.isLid) {
                    const targetRot = targetState === 'open' ? data.openRot : data.closedRot;
                    const mesh = data.isLid ? child : child.children[0]; // Lid is group, Side has mesh inside group
                    
                    if (targetRot !== undefined && mesh) {
                        new TWEEN.Tween(mesh.rotation)
                            .to({ x: targetRot }, duration)
                            .easing(targetState === 'open' ? TWEEN.Easing.Back.Out : TWEEN.Easing.Cubic.InOut) // Pop out, smooth in
                            .delay(data.isLid && targetState === 'open' ? duration * 0.3 : 0) // Delay lid on open
                            .start();
                    }
                }
                
                // Position Animation (Rotation Bodies / Parts)
                if (data.isPart) {
                    const targetPos = targetState === 'open' ? data.openPos : data.closedPos;
                    if (targetPos) {
                         new TWEEN.Tween(child.position)
                            .to({ x: targetPos.x, y: targetPos.y, z: targetPos.z }, duration)
                            .easing(TWEEN.Easing.Cubic.InOut)
                            .start();
                    }
                }
            });
        }

        // --- Geometry Builders ---

        // 1. Prism
        function buildPrism(material, mode) {
            const sides = 6;
            const radius = 1.5;
            const height = 3;
            const sideWidth = 2 * radius * Math.sin(Math.PI / sides);
            
            // Base
            const baseGeo = new THREE.CircleGeometry(radius, sides);
            const baseMesh = new THREE.Mesh(baseGeo, material);
            baseMesh.rotation.x = -Math.PI / 2;
            activeGroup.add(baseMesh);
            addEdge(baseMesh, baseGeo);

            if (mode === 'solid') {
                let geo;
                if (currentPrismType === 'oblique') {
                    geo = new THREE.CylinderGeometry(radius, radius, height, sides);
                    const shearM = new THREE.Matrix4().makeShear(0.5, 0, 0, 0, 0, 0);
                    geo.applyMatrix4(new THREE.Matrix4().makeTranslation(0, height/2, 0));
                    geo.applyMatrix4(shearM);
                    geo.applyMatrix4(new THREE.Matrix4().makeTranslation(0, -height/2, 0));
                } else {
                    geo = new THREE.CylinderGeometry(radius, radius, height, sides);
                }
                const mesh = new THREE.Mesh(geo, material);
                mesh.position.y = height / 2;
                activeGroup.add(mesh);
                addEdge(mesh, geo);
                baseMesh.visible = false;
            } else {
                // Net Mode (Built Closed)
                const topGeo = new THREE.CircleGeometry(radius, sides);
                const topMesh = new THREE.Mesh(topGeo, material);
                topMesh.rotation.x = -Math.PI / 2;
                
                for (let i = 0; i < sides; i++) {
                    const angle = (i / sides) * Math.PI * 2;
                    const pivotGroup = new THREE.Group();
                    
                    const x = Math.cos(angle + Math.PI/sides) * (radius * Math.cos(Math.PI/sides));
                    const z = Math.sin(angle + Math.PI/sides) * (radius * Math.cos(Math.PI/sides));
                    
                    pivotGroup.position.set(x, 0, z);
                    pivotGroup.rotation.y = -angle - Math.PI/sides;
                    
                    let faceGeo;
                    if (currentPrismType === 'oblique') {
                        const shape = new THREE.Shape();
                        shape.moveTo(-sideWidth/2, 0);
                        shape.lineTo(sideWidth/2, 0);
                        shape.lineTo(sideWidth/2 + 0.75, height);
                        shape.lineTo(-sideWidth/2 + 0.75, height);
                        shape.lineTo(-sideWidth/2, 0);
                        faceGeo = new THREE.ShapeGeometry(shape);
                    } else {
                        faceGeo = new THREE.PlaneGeometry(sideWidth, height);
                        faceGeo.translate(0, height/2, 0);
                    }

                    const face = new THREE.Mesh(faceGeo, material);
                    addEdge(face, faceGeo);
                    
                    // Config for Animation
                    // Closed: 0 (Vertical). Open: -PI/2 (Flat out)
                    pivotGroup.userData = { isSide: true, closedRot: 0, openRot: -Math.PI/2 };
                    face.rotation.x = 0; // Start Closed

                    pivotGroup.add(face);
                    activeGroup.add(pivotGroup);

                    // Attach Top Lid to index 0
                    if (i === 0) {
                        const topPivot = new THREE.Group();
                        if (currentPrismType === 'oblique') topPivot.position.set(0.75, height, 0);
                        else topPivot.position.set(0, height, 0);
                        
                        topPivot.add(topMesh);
                        const distToCenter = radius * Math.cos(Math.PI/sides);
                        topMesh.position.set(0, 0, -distToCenter); 
                        
                        face.add(topPivot);
                        // Lid Anim: Closed: -PI/2 (Relative to side? No, side is vertical, lid is horiz. Relative rot is -PI/2).
                        // Open: -PI/2 relative to side which is flat? 
                        // Wait. Face is vertical (0). Lid is Horizontal (-PI/2). So ClosedRot = -PI/2.
                        // When Face goes Flat (-PI/2), Lid follows. Lid needs to rotate FURTHER -PI/2 to be flat on ground?
                        // If Face is -90, Lid is vertical down. Needs another -90 to be flat.
                        topPivot.userData = { isLid: true, closedRot: -Math.PI/2, openRot: -Math.PI };
                        topPivot.rotation.x = -Math.PI/2; // Start Closed
                    }
                }
            }
        }

        // 2. Pyramid
        function buildPyramid(material, mode) {
            const sideCount = 4;
            const radius = 2;
            const height = 3;
            
            const baseGeo = new THREE.CircleGeometry(radius, sideCount, Math.PI/4);
            const baseMesh = new THREE.Mesh(baseGeo, material);
            baseMesh.rotation.x = -Math.PI / 2;
            activeGroup.add(baseMesh);
            addEdge(baseMesh, baseGeo);

            if (mode === 'solid') {
                const geo = new THREE.ConeGeometry(radius, height, sideCount);
                const mesh = new THREE.Mesh(geo, material);
                mesh.position.y = height/2;
                activeGroup.add(mesh);
                addEdge(mesh, geo);
                baseMesh.visible = false;
            } else {
                const sideWidth = radius * Math.sqrt(2);
                const slantHeight = Math.sqrt((sideWidth/2)**2 + height**2);
                
                for (let i = 0; i < sideCount; i++) {
                    const pivotGroup = new THREE.Group();
                    const angle = i * (Math.PI/2);
                    const dist = sideWidth/2;
                    
                    pivotGroup.position.set(Math.cos(angle)*dist, 0, Math.sin(angle)*dist);
                    pivotGroup.rotation.y = -angle - Math.PI/2;

                    const shape = new THREE.Shape();
                    shape.moveTo(-sideWidth/2, 0);
                    shape.lineTo(sideWidth/2, 0);
                    shape.lineTo(0, slantHeight);
                    shape.lineTo(-sideWidth/2, 0);
                    const faceGeo = new THREE.ShapeGeometry(shape);
                    const face = new THREE.Mesh(faceGeo, material);
                    
                    // Calc Closed Angle
                    const angleFromVert = Math.atan2(sideWidth/2, height); // Tilt IN
                    
                    pivotGroup.userData = { isSide: true, closedRot: angleFromVert, openRot: -Math.PI/2 };
                    face.rotation.x = angleFromVert; // Start Closed

                    addEdge(face, faceGeo);
                    pivotGroup.add(face);
                    activeGroup.add(pivotGroup);
                }
            }
        }

        // 3. Cylinder
        function buildCylinder(material, mode) {
            if (mode === 'solid') {
                const geo = new THREE.CylinderGeometry(1.5, 1.5, 3, 32);
                const mesh = new THREE.Mesh(geo, material);
                mesh.position.y = 1.5;
                activeGroup.add(mesh);
                addEdge(mesh, geo);
            } else {
                buildNetForRotation(1.5, 1.5, 3, 'rect');
            }
        }

        // 4. Cone
        function buildCone(material, mode) {
            if (mode === 'solid') {
                const geo = new THREE.ConeGeometry(2, 3, 32);
                const mesh = new THREE.Mesh(geo, material);
                mesh.position.y = 1.5;
                activeGroup.add(mesh);
                addEdge(mesh, geo);
            } else {
                buildNetForRotation(2, 0, 3, 'sector');
            }
        }

        // 5. PolyFrustum
        function buildPolyFrustum(material, mode) {
             const bottomR = 2; const topR = 1; const h = 2.5;
             const sideW_bot = bottomR * Math.sqrt(2);
             const sideW_top = topR * Math.sqrt(2);
             const slantH = Math.sqrt(((sideW_bot - sideW_top)/2)**2 + h**2);

            if (mode === 'solid') {
                const geo = new THREE.CylinderGeometry(1, 2, 2.5, 4);
                const mesh = new THREE.Mesh(geo, material);
                mesh.position.y = 1.25;
                activeGroup.add(mesh);
                addEdge(mesh, geo);
            } else {
                const baseGeo = new THREE.PlaneGeometry(sideW_bot, sideW_bot);
                const base = new THREE.Mesh(baseGeo, material);
                base.rotation.x = -Math.PI/2;
                activeGroup.add(base);
                addEdge(base, baseGeo);

                const topGeo = new THREE.PlaneGeometry(sideW_top, sideW_top);
                const top = new THREE.Mesh(topGeo, material);
                top.rotation.x = -Math.PI/2;
                
                // Top animation: Closed at height h, Open at far position
                const openZ = -sideW_bot/2 - sideW_top/2 - slantH - 0.5;
                top.userData = { isPart: true, closedPos: new THREE.Vector3(0, h, 0), openPos: new THREE.Vector3(0, 0, openZ) };
                top.position.set(0, h, 0); // Start Closed
                
                activeGroup.add(top);
                addEdge(top, topGeo);

                for(let i=0; i<4; i++) {
                     const pivotGroup = new THREE.Group();
                     const angle = i * Math.PI/2;
                     const dist = sideW_bot/2;
                     pivotGroup.position.set(Math.cos(angle)*dist, 0, Math.sin(angle)*dist);
                     pivotGroup.rotation.y = -angle - Math.PI/2;
                     
                     const shape = new THREE.Shape();
                     shape.moveTo(-sideW_bot/2, 0);
                     shape.lineTo(sideW_bot/2, 0);
                     shape.lineTo(sideW_top/2, slantH);
                     shape.lineTo(-sideW_top/2, slantH);
                     const trapGeo = new THREE.ShapeGeometry(shape);
                     const mesh = new THREE.Mesh(trapGeo, material);
                     
                     const angleFromVert = Math.atan2((sideW_bot - sideW_top)/2, h);
                     pivotGroup.userData = { isSide: true, closedRot: angleFromVert, openRot: -Math.PI/2 };
                     mesh.rotation.x = angleFromVert; // Start Closed

                     pivotGroup.add(mesh);
                     activeGroup.add(pivotGroup);
                     addEdge(mesh, trapGeo);
                }
            }
        }

        // 6. CircFrustum
        function buildCircFrustum(material, mode) {
            if (mode === 'solid') {
                const geo = new THREE.CylinderGeometry(1, 2, 2.5, 32);
                const mesh = new THREE.Mesh(geo, material);
                mesh.position.y = 1.25;
                activeGroup.add(mesh);
                addEdge(mesh, geo);
            } else {
                buildNetForRotation(2, 1, 2.5, 'annulus');
            }
        }

        // 7. Sphere
        function buildSphere(material) {
             const geo = new THREE.SphereGeometry(2, 32, 32);
             const mesh = new THREE.Mesh(geo, material);
             mesh.position.y = 2;
             activeGroup.add(mesh);
             addEdge(mesh, geo);
        }

        // Helper for Nets of Rotation Bodies (Decomposition)
        function buildNetForRotation(rBottom, rTop, h, type) {
            const group = new THREE.Group();
            
            // Bottom Circle (Static)
            const c1 = new THREE.Mesh(new THREE.CircleGeometry(rBottom, 64), getCommonMaterial());
            c1.rotation.x = -Math.PI/2;
            group.add(c1);
            addEdge(c1, c1.geometry);

            let latGeo;
            let latMesh;
            let R_outer = 0, R_inner = 0;
            
            if (type === 'rect') {
                // Cylinder
                const w = 2 * Math.PI * rBottom;
                latGeo = new THREE.PlaneGeometry(w, h);
                latMesh = new THREE.Mesh(latGeo, getCommonMaterial());
                latMesh.rotation.x = -Math.PI/2;
                
                const finalZ = rBottom + h/2 + 0.5;
                latMesh.userData = { isPart: true, closedPos: new THREE.Vector3(0, h/2, 0), openPos: new THREE.Vector3(0, 0, finalZ) };
                latMesh.position.set(0, h/2, 0); // Start Closed
                
                group.add(latMesh);
                addEdge(latMesh, latGeo);
                
                // Top Circle
                const c2 = new THREE.Mesh(new THREE.CircleGeometry(rBottom, 64), getCommonMaterial());
                c2.rotation.x = -Math.PI/2;
                const c2Z = finalZ + h/2 + rBottom + 0.5;
                c2.userData = { isPart: true, closedPos: new THREE.Vector3(0, h, 0), openPos: new THREE.Vector3(0, 0, c2Z) };
                c2.position.set(0, h, 0); // Start Closed
                
                group.add(c2);
                addEdge(c2, c2.geometry);

            } else if (type === 'sector' || type === 'annulus') {
                const l = Math.sqrt((rBottom - rTop)**2 + h**2);
                const circum = 2 * Math.PI * rBottom;
                const theta = circum / l; 
                
                const shape = new THREE.Shape();
                shape.moveTo(0, 0);
                
                R_outer = rTop === 0 ? l : l * rBottom / (rBottom - rTop);
                R_inner = rTop === 0 ? 0 : R_outer - l;
                
                if (type === 'annulus') {
                    shape.absarc(0, 0, R_inner, -theta/2 + Math.PI/2, theta/2 + Math.PI/2, false);
                    shape.absarc(0, 0, R_outer, theta/2 + Math.PI/2, -theta/2 + Math.PI/2, true);
                    shape.closePath();
                } else {
                    shape.moveTo(0, 0);
                    shape.arc(0, 0, R_outer, -theta/2 + Math.PI/2, theta/2 + Math.PI/2, false);
                    shape.closePath();
                }
                
                latGeo = new THREE.ShapeGeometry(shape);
                latMesh = new THREE.Mesh(latGeo, getCommonMaterial());
                latMesh.rotation.x = -Math.PI/2;
                
                const finalZ = rBottom + R_inner + (R_outer-R_inner)/2 + 0.5;
                latMesh.userData = { isPart: true, closedPos: new THREE.Vector3(0, h/2, 0), openPos: new THREE.Vector3(0, 0, finalZ) };
                latMesh.position.set(0, h/2, 0);

                group.add(latMesh);
                addEdge(latMesh, latGeo);

                if (rTop > 0) {
                    const c2 = new THREE.Mesh(new THREE.CircleGeometry(rTop, 32), getCommonMaterial());
                    c2.rotation.x = -Math.PI/2;
                    const c2Z = finalZ + (R_outer-R_inner)/2 + rTop + 0.5;
                    c2.userData = { isPart: true, closedPos: new THREE.Vector3(0, h, 0), openPos: new THREE.Vector3(0, 0, c2Z) };
                    c2.position.set(0, h, 0);
                    group.add(c2);
                    addEdge(c2, c2.geometry);
                }
            }
            activeGroup.add(group);
        }

        function addEdge(mesh, geo) {
            const edges = new THREE.EdgesGeometry(geo);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: COLOR_EDGE }));
            mesh.add(line);
        }

        // --- Standard Loop ---
        function animate() {
            requestAnimationFrame(animate);
            TWEEN.update();
            controls.update();
            if (isAutoRotate && activeGroup) activeGroup.rotation.y += 0.005;
            renderer.render(scene, camera);
        }

        // --- Helper: UI Update ---
        function updateInfoPanel(data) {
            document.getElementById('shape-title').innerText = data.title;
            
            let html = `
                <div class="mb-4">
                    <h3 class="text-blue-300 font-semibold mb-1">定义</h3>
                    <p class="text-sm text-gray-300 leading-relaxed border-l-2 border-blue-500 pl-2">${data.definition}</p>
                </div>
                <div class="mb-4">
                    <h3 class="text-blue-300 font-semibold mb-1">结构特征</h3>
                    <ul class="list-disc list-inside text-sm text-gray-300 space-y-1">
                        ${data.features.map(f => `<li>${f}</li>`).join('')}
                    </ul>
                </div>
                <div>
                    <h3 class="text-blue-300 font-semibold mb-1">公式</h3>
                    <div class="bg-slate-800 bg-opacity-60 p-3 rounded border border-slate-700">
            `;

            for (const [key, val] of Object.entries(data.formulas)) {
                if (key === 'note') {
                    html += `<p class="text-xs text-gray-400 mt-2 italic border-t border-gray-600 pt-1">${val}</p>`;
                } else {
                    html += `<div class="math-display">$$${val}$$</div>`;
                }
            }

            html += `</div></div>`;
            document.getElementById('shape-content').innerHTML = html;
            if (window.MathJax) MathJax.typesetPromise();
        }

        window.onload = init;

    </script>
</body>
